[package]
name = "detektive-consumer"
version = "0.1.0"
description = "Consumes the payments stream from Redpanda"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.9", features = ["derive"] }
prometheus = { version = "0.14.0", default-features = false }
rdkafka = { version = "0.39.0", features = ["cmake-build", "libz-static"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "time", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
detektive-replay = { path = "../replay", features = ["kafka"] }
tokio = { version = "1.54.1", features = ["io-util"] }
