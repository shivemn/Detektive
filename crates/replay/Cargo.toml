[package]
name = "detektive-replay"
version = "0.1.0"
description = "Replays IBM AML transactions as a time-ordered payment stream"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
clap = { version = "4.6.9", features = ["derive"] }
csv = "1.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rdkafka = { version = "0.39.0", default-features = false, features = ["cmake-build", "libz-static"], optional = true }

[features]
# Redpanda/Kafka output. Off by default so the replayer also builds on plain
# Windows, where librdkafka is hard to compile.
kafka = ["dep:rdkafka"]
