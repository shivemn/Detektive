[package]
name = "detektive-graph"
version = "0.1.0"
description = "Time-windowed payment graph and the features computed on it"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
clap = { version = "4.6.9", features = ["derive"] }
detektive-replay = { path = "../replay" }
rayon = "1.12.0"
rustc-hash = "2"
