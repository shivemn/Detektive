[package]
name = "detektive-score"
version = "0.1.0"
description = "Scores payments with a tree model exported to ONNX"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.9", features = ["derive"] }
detektive-graph = { path = "../graph" }
detektive-replay = { path = "../replay" }
prost = "0.14.6"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "score"
harness = false
