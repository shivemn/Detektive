name: ml

on:
  push:
    paths: ["ml/**", ".github/workflows/ml.yml"]
  pull_request:
    paths: ["ml/**", ".github/workflows/ml.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest -q
