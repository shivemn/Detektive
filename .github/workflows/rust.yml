name: rust

on:
  push:
    paths: ["crates/**", "Cargo.toml", "Cargo.lock", ".github/workflows/rust.yml", "ml/tests/fixtures/**", "observability/grafana/dashboards/**", "ml/src/detektive_ml/graph_check.py", "ml/src/detektive_ml/nx_check.py", "ml/src/detektive_ml/synthetic.py", "scripts/check_features.sh"]
  pull_request:
    paths: ["crates/**", "Cargo.toml", "Cargo.lock", ".github/workflows/rust.yml", "ml/tests/fixtures/**", "observability/grafana/dashboards/**", "ml/src/detektive_ml/graph_check.py", "ml/src/detektive_ml/nx_check.py", "ml/src/detektive_ml/synthetic.py", "scripts/check_features.sh"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # librdkafka is compiled from source for the Kafka parts
      - run: sudo apt-get update && sudo apt-get install -y cmake libcurl4-openssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # the replayer must also build without Kafka, for plain Windows
      - run: cargo clippy -p detektive-replay --all-targets -- -D warnings
      # end-to-end tests use librdkafka's in-process mock cluster: no Docker needed
      - run: cargo test --workspace --all-features

  # the engine's features against a brute-force recount in Python and
  # against NetworkX, and batch mode against one by one
  features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/pyproject.toml
      - run: pip install -e ml
      - run: bash scripts/check_features.sh
