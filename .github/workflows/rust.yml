name: rust

on:
  push:
    paths: ["crates/**", "Cargo.toml", "Cargo.lock", ".github/workflows/rust.yml", "ml/tests/fixtures/**", "observability/grafana/dashboards/**"]
  pull_request:
    paths: ["crates/**", "Cargo.toml", "Cargo.lock", ".github/workflows/rust.yml", "ml/tests/fixtures/**", "observability/grafana/dashboards/**"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # librdkafka is compiled from source for the Kafka parts
      - run: sudo apt-get update && sudo apt-get install -y cmake libcurl4-openssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # the replayer must also build without Kafka, for plain Windows
      - run: cargo clippy -p detektive-replay --all-targets -- -D warnings
      # end-to-end tests use librdkafka's in-process mock cluster: no Docker needed
      - run: cargo test --workspace --all-features
