# Local stack: one Redpanda broker and its console, the Detektive consumer,
# Prometheus and Grafana. Start with `docker compose up -d --build` (the first
# build compiles librdkafka and takes a few minutes), stop with
# `docker compose down` (add `-v` to also delete stored messages and metrics).
#
#   Kafka API for programs on your machine:  localhost:19092
#   Redpanda Console:                         http://localhost:8080
#   Consumer metrics:                         http://localhost:9898/metrics
#   Prometheus:                               http://localhost:9090
#   Grafana (dashboard "Detektive"):          http://localhost:3000
#
# To score payments, export a model into ./models (see docs/scoring.md) and
# set DETEKTIVE_MODEL=/models, on the command line or in .env. Without it the
# consumer builds the graph but scores nothing. DETEKTIVE_MODEL_DIR points the
# mount somewhere other than ./models.
#
# Another project already on one of those ports? Pick others, on the command
# line or in a .env file next to this one (kept out of git):
#   GRAFANA_PORT=3001 PROMETHEUS_PORT=9091 docker compose up -d
# CONSOLE_PORT and METRICS_PORT work the same way. Kafka's 19092 is fixed,
# because the broker advertises that address to clients.
#
# Feed it with the replayer, here 1 hour of data per second:
#   docker compose run --rm replay --speed 3600

name: detektive

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.1.14
    container_name: detektive-redpanda
    command:
      - redpanda
      - start
      # one listener for containers on this network, one for your machine
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      # development settings: relaxed fsync, small footprint, one core
      - --mode dev-container
      - --smp 1
      - --memory 1G
      - --default-log-level=info
    ports:
      - "19092:19092"
      - "19644:9644" # admin API
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24

  # Creates the topics once Redpanda is healthy, then exits.
  # payments: 3 partitions, keyed by sender account, so one sender's payments
  # stay in order while the stream can still be spread across consumers.
  topics:
    image: docker.redpanda.com/redpandadata/redpanda:v26.1.14
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: /bin/bash
    command:
      - -c
      - |
        rpk topic create payments --partitions 3 -X brokers=redpanda:9092 || true
        rpk topic create payments-dead-letter --partitions 1 -X brokers=redpanda:9092 || true
        rpk topic create alerts --partitions 1 -X brokers=redpanda:9092 || true
        rpk topic list -X brokers=redpanda:9092
    restart: "no"

  console:
    image: docker.redpanda.com/redpandadata/console:v3.10.0
    container_name: detektive-console
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: /bin/sh
    command: -c 'echo "$$CONSOLE_CONFIG_FILE" > /tmp/config.yml && /app/console'
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["redpanda:9092"]
    ports:
      - "${CONSOLE_PORT:-8080}:8080"

  # The consumer, built from this repo's Dockerfile.
  consumer:
    build: .
    image: detektive:dev
    container_name: detektive-consumer
    depends_on:
      topics:
        condition: service_completed_successfully
    command: ["--brokers", "redpanda:9092", "--metrics-addr", "0.0.0.0:9898", "--model", "${DETEKTIVE_MODEL:-none}"]
    ports:
      - "${METRICS_PORT:-9898}:9898"
    volumes:
      - ${DETEKTIVE_MODEL_DIR:-./models}:/models:ro
    restart: unless-stopped

  # On demand only: `docker compose run --rm replay [flags]`. Reads the data
  # from ./data/raw, or from DETEKTIVE_DATA_DIR if set (an absolute path).
  replay:
    build: .
    image: detektive:dev
    profiles: ["tools"]
    depends_on:
      topics:
        condition: service_completed_successfully
    entrypoint: ["detektive-replay", "/data/HI-Small_Trans.csv", "--out", "kafka", "--brokers", "redpanda:9092"]
    command: ["--speed", "3600"]
    volumes:
      - ${DETEKTIVE_DATA_DIR:-./data/raw}:/data:ro

  prometheus:
    image: prom/prometheus:v3.16.0
    container_name: detektive-prometheus
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway" # reach a consumer run with `cargo run`
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    image: grafana/grafana:13.2.4
    container_name: detektive-grafana
    depends_on:
      - prometheus
    environment:
      # local use only: open the dashboard without logging in
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/detektive.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"

volumes:
  redpanda-data:
  prometheus-data:
  grafana-data:
